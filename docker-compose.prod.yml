services:
  # ── NestJS API Backend ───────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: telecalling_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-telecalling}:${POSTGRES_PASSWORD:-telecalling123}@postgres:5432/${POSTGRES_DB:-telecalling_crm}?schema=public
      JWT_SECRET: ${JWT_SECRET:-solar_telecalling_production_jwt_secret_2026_super_secure}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-solar_telecalling_refresh_secret_2026_production}
      S3_ENDPOINT: minio
      S3_PORT: 9000
      S3_USE_SSL: "false"
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET_NAME: recordings
      CFG_SIMULATION_MODE: ${CFG_SIMULATION_MODE:-false}
      CFG_WHATSAPP_SANDBOX: ${CFG_WHATSAPP_SANDBOX:-false}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - telecalling_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/reports/summary || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Next.js Web Manager Dashboard ───────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: telecalling_web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: /api
    depends_on:
      - api
    networks:
      - telecalling_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── PostgreSQL 16 System of Record ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: telecalling_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-telecalling}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telecalling123}
      POSTGRES_DB: ${POSTGRES_DB:-telecalling_crm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - telecalling_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-telecalling} -d ${POSTGRES_DB:-telecalling_crm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── MinIO S3 Object Storage for Call Audio ───────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: telecalling_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - telecalling_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── Nginx Reverse Proxy & SSL Gateway ───────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: telecalling_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    networks:
      - telecalling_network

  # ── Automated Daily PostgreSQL Backup Cron Worker ────────────────────────────
  backup_cron:
    image: postgres:16-alpine
    container_name: telecalling_backup_cron
    restart: always
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-telecalling}
      PGPASSWORD: ${POSTGRES_PASSWORD:-telecalling123}
      PGDATABASE: ${POSTGRES_DB:-telecalling_crm}
    volumes:
      - backups_data:/backups
      - ./scripts/backup-db.sh:/usr/local/bin/backup-db.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        chmod +x /usr/local/bin/backup-db.sh
        echo "0 2 * * * /usr/local/bin/backup-db.sh >> /var/log/backup.log 2>&1" > /etc/crontabs/root
        crond -f -l 8
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - telecalling_network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  backups_data:
    driver: local

networks:
  telecalling_network:
    driver: bridge

