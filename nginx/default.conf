# Telecalling CRM Production Nginx Reverse Proxy Configuration
# Provides SSL termination, rate limiting, gzip compression, and unified routing.

upstream api_upstream {
    server api:4000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream web_upstream {
    server web:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Client payload bounds for audio recording sync and lead CSV imports
    client_max_body_size 100M;
    client_body_buffer_size 16M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # NestJS API Backend
    location /api/ {
        proxy_pass http://api_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 15s;
    }

    # Swagger Documentation
    location /api/docs {
        proxy_pass http://api_upstream/api/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Direct APK Download Endpoint
    location /telecalling-crm.apk {
        proxy_pass http://web_upstream/telecalling-crm.apk;
        proxy_set_header Host $host;
        add_header Content-Disposition 'attachment; filename="telecalling-crm.apk"';
        add_header Content-Type application/vnd.android.package-archive;
    }

    # Next.js Web Manager Dashboard & Download Portal
    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

